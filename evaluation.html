<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireFlow - Evaluation</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
</head>
<body>
    <header>
        <h1>HireFlow</h1>
        <p>Applicant tracking system</p>
    </header>
    <main>
        <section>
            <h2>Candidate Evaluation</h2>
            <p>Evaluate the candidate after the interview.</p>
            <div>
                <h3>Candidate Information</h3>
                <p><strong>Name:</strong> Arun Kumar</p>
                <p><strong>Position:</strong> Backend Developer</p>
                <p><strong>Interview Type:</strong>Technical</p>
            </div>
            <div>
                <h3>Evaluation</h3>
                <label>Score:</label>
                <input type="number" max="100" min="0" placeholder="Enter Score">
                <br><br>
                <label>Feedback:</label>
                <br>
                <textarea rows="4" cols="40" placeholder="Enter Feedback"></textarea>
                <br><br>
                <label>Final Decision</label>
                <select>
                    <option value="">Select Decision</option>
                    <option value="selected">Selected</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>
             <div>
                <h3>Evaluation Action</h3>
                <button>Submit Evaluation</button>
            </div>
        </section>
    </main>
    
</body>
</html>
