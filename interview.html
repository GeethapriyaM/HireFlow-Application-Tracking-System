<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HireFlow - Interviews</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script src="js/script.js"></script>

</head>

<body>

    <header>

        <h1>HireFlow</h1>

        <p>Applicant tracking system</p>

    </header>


    <main>

        <section>

            <h2>Interviews</h2>

            <p>
                Manage and track candidate interviews.
            </p>


            <!-- =========================================
                 UPCOMING INTERVIEWS
            ========================================== -->

            <div>

                <h3>Upcoming Interviews</h3>

                <table
                    id="upcomingInterviews"
                    border="1"
                >

                    <thead>

                        <tr>

                            <th>Candidate</th>

                            <th>Position</th>

                            <th>Date</th>

                            <th>Time</th>

                            <th>Interview Type</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody></tbody>

                </table>

            </div>


            <!-- =========================================
                 COMPLETED INTERVIEWS
            ========================================== -->

            <div>

                <h3>Completed Interviews</h3>

                <table
                    id="completedInterviews"
                    border="1"
                >

                    <thead>

                        <tr>

                            <th>Candidate</th>

                            <th>Position</th>

                            <th>Date</th>

                            <th>Interview Type</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody></tbody>

                </table>

            </div>


            <!-- =========================================
                 INTERVIEW ACTIONS
            ========================================== -->

            <div>

                <h3>Interview Actions</h3>

                <button
                    data-action="schedule-interview"
                >
                    Schedule Interview
                </button>

            </div>


        </section>

    </main>


    <script src="js/interview.js"></script>

</body>

</html>
