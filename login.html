<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | HireFlow</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-brand">

            <div class="brand-content">

                <h1>HireFlow</h1>

                <h2>Find the right talent.<br>Build the right future.</h2>

                <p>
                    A smarter way to connect candidates and recruiters
                    through a simple and powerful hiring platform.
                </p>

            </div>

        </div>


        <!-- Right Side -->
        <div class="auth-form-container">

            <div class="auth-form">

                <h1>Welcome Back 👋</h1>

                <p class="auth-subtitle">
                    Login to continue to HireFlow
                </p>


                <form id="loginForm">

                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Login
                    </button>


                    <!-- Message -->
                    <p
                        id="message"
                        class="auth-message"
                    ></p>

                </form>


                <!-- Register Link -->
                <p class="auth-switch">

                    Don't have an account?

                    <a href="register.html">
                        Create an account
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
