<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireFlow - Recruitment</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>HireFlow</h1>
        <p>Applicant tracking system</p>
    </header>

    <main>
        <section>
            <h2>Recruitment</h2>
            <p>Manage candidates through the recruitment process.</p>

            <div>
                <input type="text" placeholder="Search Candidates">

                <select id="statusFilter">
                    <option value="">All Status</option>
                    <option value="Applied">Applied</option>
                    <option value="Screening">Screening</option>
                    <option value="Interview">Interview</option>
                    <option value="Selected">Selected</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>

            <br><br>

            <table>
                <thead>
                    <tr>
                        <th>Candidate</th>
                        <th>Position</th>
                        <th>Experience</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="candidateTableBody">
                    <tr>
                        <td colspan="5">Loading candidates...</td>
                    </tr>
                </tbody>
            </table>

            <div>
                <h3>Recruitment Actions</h3>
                <button data-action="schedule-interview">
                    Schedule Interview
                </button>
            </div>

        </section>
    </main>

    <script src="js/script.js"></script>

</body>
</html>
