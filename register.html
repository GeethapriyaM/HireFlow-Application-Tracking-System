<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | HireFlow</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-brand">

            <div class="brand-content">

                <h1>HireFlow</h1>

                <h2>Start your journey<br>with HireFlow.</h2>

                <p>
                    Whether you're looking for your next opportunity
                    or searching for great talent, HireFlow makes
                    recruitment simple.
                </p>

            </div>

        </div>


        <!-- Right Side -->
        <div class="auth-form-container">

            <div class="auth-form">

                <h1>Create Account</h1>

                <p class="auth-subtitle">
                    Join HireFlow today
                </p>


                <form id="registerForm">

                    <!-- Name -->
                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                    </div>


                    <!-- Role -->
                    <div class="form-group">

                        <label for="role">
                            Register as
                        </label>

                        <select id="role" required>

                            <option value="">
                                Select your role
                            </option>

                            <option value="candidate">
                                Candidate
                            </option>

                            <option value="recruiter">
                                Recruiter
                            </option>

                        </select>

                    </div>


                    <!-- Register Button -->
                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Create Account
                    </button>


                    <!-- Message -->
                    <p
                        id="message"
                        class="auth-message"
                    ></p>

                </form>


                <!-- Login Link -->
                <p class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="js/register.js"></script>

</body>

</html>
